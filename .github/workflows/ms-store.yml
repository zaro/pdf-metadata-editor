name: Submit to Microsoft Store

on:
  release:
    types: [released]   # fires when a draft is published

jobs:
  store:
    # Actually skip pre-releases (the `released` event also fires for them)
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      # The Store rejects URLs that redirect (e.g. GitHub release assets).
      # Serve both installers through the pdf.metadata.care proxy, which
      # streams the file directly (no redirects), keyed by release tag name.
      - name: Build product update payload
        id: update
        shell: pwsh
        env:
          ASSETS: ${{ toJson(github.event.release.assets) }}
        run: |
          $assets = $env:ASSETS | ConvertFrom-Json
          $x64 = $assets | Where-Object { $_.name -like '*-amd64.msi' }
          $arm = $assets | Where-Object { $_.name -like '*-arm64.msi' }
          if (-not $x64) { throw "No amd64 .msi asset found on this release" }
          if (-not $arm) { throw "No arm64 .msi asset found on this release" }
          $tag = "${{ github.event.release.tag_name }}"
          $base = "https://pdf.metadata.care/microsoft-store-files/$tag/msi"
          # Full module update: BOTH packages must be present in one payload,
          # otherwise the missing architecture is dropped from the submission.
          # The API expects {"packages":[...]}, not a bare array.
          $productUpdate = @{
            packages = @(
              @{ packageUrl = "$base/amd64/"; languages = @('en'); architectures = @('X64');   isSilentInstall = $true; packageType = 'msi' },
              @{ packageUrl = "$base/arm64/"; languages = @('en'); architectures = @('Arm64'); isSilentInstall = $true; packageType = 'msi' }
            )
          } | ConvertTo-Json -Depth 4 -Compress
          "product-update=$productUpdate" >> $env:GITHUB_OUTPUT

      - name: Configure Store credentials
        uses: microsoft/store-submission@v1
        with:
          type: win32
          command: configure
          seller-id: ${{ secrets.SELLER_ID }}
          product-id: ${{ secrets.PRODUCT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}

      - name: Update draft submission
        uses: microsoft/store-submission@v1
        with:
          type: win32
          command: update
          product-update: ${{ steps.update.outputs.product-update }}

      - name: Publish submission
        uses: microsoft/store-submission@v1
        with:
          type: win32
          command: publish